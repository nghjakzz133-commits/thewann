<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE WANN | Thư Viện</title>

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .gallery-hero{
      position: relative;
      height: 60vh;
      min-height: 420px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .gallery-hero video{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.55) saturate(1.1);
    }

    .gallery-hero::after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.15), rgba(0,0,0,0.85));
    }

    .gallery-hero-content{
      position: relative;
      z-index: 2;
      padding: 0 18px;
    }

    .gallery-hero-content h1{
      margin: 0 0 10px;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #fff;
    }

    .gallery-hero-content p{
      margin: 0;
      color: rgba(255,255,255,0.85);
      font-size: 15px;
    }

    .gallery-wrap{
      padding: 40px 16px 80px;
      max-width: 1150px;
      margin: 0 auto;
    }

    .gallery-head{
      display:flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .gallery-title{
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
    }

    .gallery-title span{
      color: #d4a73d;
    }

    .gallery-filter{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn{
      border: 1px solid rgba(212,167,61,0.35);
      background: rgba(0,0,0,0.35);
      color: #eee;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }

    .filter-btn.active{
      background: linear-gradient(90deg, #f7d77a, #d4a73d);
      color: #111;
      font-weight: 800;
    }

    .wann-grid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media(min-width:900px){
      .wann-grid{grid-template-columns:repeat(4,1fr);}
    }

    .wann-card{
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .wann-card img{
      width:100%;
      height:260px;
      object-fit:cover;
    }

    .wann-tag{
      position:absolute;
      top:12px;
      left:12px;
      padding:6px 12px;
      background:rgba(0,0,0,.6);
      color:#fff;
      font-size:12px;
      border-radius:999px;
    }

    /* VIDEO SECTION */
    .gallery-video-section{
      padding: 20px 0 120px;
    }

    .video-scroll{
      display:flex;
      gap:16px;
      overflow-x:auto;
      padding:10px 16px;
    }

    .video-item{
      flex:0 0 70%;
      max-width:70%;
      height:220px;
      border-radius:16px;
      overflow:hidden;
      background:#000;
    }

    .video-item video{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    @media(max-width:768px){
      .video-item{flex:0 0 85%;max-width:85%;}
    }
  </style>
</head>

<body>

<header class="header">
  <div class="container header-inner">
    <h1 class="logo">THE WANN</h1>
    <img src="assets/images/logo.png" class="header-logo">
    <nav class="navbar">
      <a href="index.html">Trang Chủ</a>
      <a href="about.html">Giới Thiệu</a>
      <a href="gallery.html">Thư Viện</a>
      <a href="booking.html">Đặt Bàn</a>
      <a href="contact.html">Liên Hệ</a>
    </nav>
  </div>
</header>

<section class="gallery-hero">
  <video autoplay muted loop playsinline>
    <source src="assets/videos/hero.mp4" type="video/mp4">
  </video>
  <div class="gallery-hero-content">
    <h1>Thư Viện</h1>
    <p>Vibe • Ánh sáng • Trải nghiệm</p>
  </div>
</section>

<section class="gallery-wrap">
  <div class="gallery-head">
    <h2 class="gallery-title">Khoảnh khắc tại <span>THE WANN</span></h2>
    <div class="gallery-filter">
      <div class="filter-btn active" data-filter="all">Tất cả</div>
      <div class="filter-btn" data-filter="party">Party</div>
      <div class="filter-btn" data-filter="vip">VIP</div>
      <div class="filter-btn" data-filter="moment">Moment</div>
    </div>
  </div>

  <div class="wann-grid">
    <div class="wann-card" data-type="party"><span class="wann-tag">Party</span><img src="assets/images/gallery/5.jpg"></div>
    <div class="wann-card" data-type="vip"><span class="wann-tag">VIP</span><img src="assets/images/gallery/6.jpg"></div>
    <div class="wann-card" data-type="moment"><span class="wann-tag">Moment</span><img src="assets/images/gallery/7.jpg"></div>
    <div class="wann-card" data-type="party"><span class="wann-tag">Party</span><img src="assets/images/gallery/8.jpg"></div>
    <div class="wann-card" data-type="vip"><span class="wann-tag">VIP</span><img src="assets/images/gallery/9.jpg"></div>
    <div class="wann-card" data-type="party"><span class="wann-tag">Party</span><img src="assets/images/gallery/10.jpg"></div>
    <div class="wann-card" data-type="moment"><span class="wann-tag">Moment</span><img src="assets/images/gallery/11.jpg"></div>
    <div class="wann-card" data-type="vip"><span class="wann-tag">VIP</span><img src="assets/images/gallery/12.jpg"></div>
  </div>
</section>

<section class="gallery-video-section">
  <div class="section-title">
    <h2>Video <span>Khoảnh Khắc</span></h2>
  </div>

  <div class="video-scroll">
    <div class="video-item"><video autoplay muted loop playsinline src="https://pub-52cf7508df4b4c109b66a730e3ab5569.r2.dev/1JEKCP8S4_725072.mov"></video></div>
    <div class="video-item"><video autoplay muted loop playsinline src="https://pub-52cf7508df4b4c109b66a730e3ab5569.r2.dev/1JF0EO8HG_725072.mov"></video></div>
    <div class="video-item"><video autoplay muted loop playsinline src="https://pub-52cf7508df4b4c109b66a730e3ab5569.r2.dev/1111-01.mov"></video></div>
    <div class="video-item"><video autoplay muted loop playsinline src="https://pub-52cf7508df4b4c109b66a730e3ab5569.r2.dev/thewann.11.11(2).mov"></video></div>
  </div>
</section>

</body>
</html>
