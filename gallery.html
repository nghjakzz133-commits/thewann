<head>

  <style>
    .gallery-hero{
      position: relative;
      height: 60vh;
      min-height: 420px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .gallery-hero video{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.55) saturate(1.1);
    }

    .gallery-hero::after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.15), rgba(0,0,0,0.85));
    }

    .gallery-hero-content{
      position: relative;
      z-index: 2;
      padding: 0 18px;
    }

    .gallery-hero-content h1{
      margin: 0 0 10px;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 25px rgba(255,255,255,0.08);
    }

    .gallery-hero-content p{
      margin: 0;
      color: rgba(255,255,255,0.85);
      font-size: 15px;
      letter-spacing: 0.6px;
    }

    .gallery-wrap{
      padding: 40px 16px 110px;
      max-width: 1150px;
      margin: 0 auto;
    }

    .gallery-head{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .gallery-title{
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.8px;
      margin: 0;
      text-transform: uppercase;
    }

    .gallery-title span{
      color: #d4a73d;
      text-shadow: 0 0 18px rgba(212,167,61,0.35);
    }

    .gallery-filter{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .filter-btn{
      border: 1px solid rgba(212,167,61,0.35);
      background: rgba(0,0,0,0.35);
      color: #eee;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s ease;
      user-select:none;
    }

    .filter-btn.active{
      background: linear-gradient(90deg, #f7d77a, #d4a73d);
      color: #111;
      border-color: transparent;
      font-weight: 800;
    }

    .wann-grid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    @media(min-width: 900px){
      .wann-grid{ grid-template-columns: repeat(4, 1fr); }
      .gallery-hero-content h1{ font-size: 48px; }
    }

    .wann-card{
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transform: translateZ(0);
    }

    .wann-card img{
      width: 100%;
      height: 260px;
      object-fit: cover;
      display:block;
      transition: transform .35s ease, filter .35s ease;
      filter: saturate(1.1) contrast(1.05);
    }

    @media(min-width: 900px){
      .wann-card img{ height: 240px; }
    }

    .wann-card:hover img{
      transform: scale(1.06);
      filter: saturate(1.2) contrast(1.1) brightness(1.03);
    }

    .wann-tag{
      position:absolute;
      left: 12px;
      top: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(212,167,61,0.35);
      color: #f5f5f5;
      font-size: 12px;
      letter-spacing: 0.4px;
      backdrop-filter: blur(6px);
    }

    /* Lightbox */
    .wann-lightbox{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 9999;
      padding: 20px;
    }

    .wann-lightbox.active{ display:flex; }

    .wann-lightbox img{
      width: 100%;
      max-width: 980px;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 50px rgba(0,0,0,0.7);
    }

    .wann-close{
      position:absolute;
      top: 18px;
      right: 18px;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

<script>
  // Filter
  const filterBtns = document.querySelectorAll(".filter-btn");
  const galleryCards = document.querySelectorAll(".wann-card");

  filterBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      filterBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      const type = btn.dataset.filter;

      galleryCards.forEach(card => {
        const cardType = card.dataset.type;
        if(type === "all" || type === cardType){
          card.style.display = "block";
        }else{
          card.style.display = "none";
        }
      });
    });
  });

  // Lightbox
  const wannLightbox = document.getElementById("wannLightbox");
  const wannLightboxImg = document.getElementById("wannLightboxImg");
  const wannClose = document.getElementById("wannClose");

  galleryCards.forEach(card => {
    card.addEventListener("click", () => {
      const img = card.querySelector("img");
      wannLightboxImg.src = img.src;
      wannLightbox.classList.add("active");
    });
  });

  wannClose.addEventListener("click", () => {
    wannLightbox.classList.remove("active");
  });

  wannLightbox.addEventListener("click", (e) => {
    if(e.target === wannLightbox) wannLightbox.classList.remove("active");
  });
</script>
