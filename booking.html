<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Booking – The WANN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <div class="hero-content">
    <h1>BOOKING</h1>
    <p>Đặt bàn nhanh – Trải nghiệm nightlife đẳng cấp</p>
  </div>
</header>


<div class="booking-info">
  <ul>
    <li>✔ Xác nhận nhanh trong 5–10 phút</li>
    <li>✔ Hỗ trợ giữ bàn & chọn vị trí đẹp</li>
    <li>✔ Phù hợp sinh nhật, nhóm bạn, khách VIP</li>
    <li>✔ Tư vấn trực tiếp qua Zalo / Hotline</li>
  </ul>
</div>
<section>
  <div class="section-title">
    <h2>Thông tin <span>đặt bàn</span></h2>
  </div>

  <form>
    <input type="text" placeholder="Họ và tên" required>
    <input type="tel" placeholder="Số điện thoại" required>
    <input type="date" required>
    <input type="number" placeholder="Số lượng khách" required>
    <textarea placeholder="Yêu cầu thêm (nếu có)"></textarea>
    <button type="submit">Gửi yêu cầu booking</button>
  </form>
</section>

<footer>
  <p>Hotline / Zalo: 0899 996 977</p>
</footer>

</body>
</html>
