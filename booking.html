<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>VIP Booking | THE WANN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <!-- HEADER LOAD BẰNG JS -->
  <div id="header"></div>

  <!-- BOOKING SECTION -->
  <section class="section glass booking-section">

    <h1 data-lang="booking_title">VIP TABLE BOOKING</h1>
    <p data-lang="booking_desc">Our team will confirm your booking</p>

    <!-- 🔥 VIP BOOKING FORM -->
    <div class="booking-form vip-form">

      <div class="form-group">
        <input type="text" id="name" data-lang="name" placeholder="Họ và tên">
      </div>

      <div class="form-row">
        <input type="date" id="date">
        <input type="time" id="time">
      </div>

      <div class="form-group">
        <input type="number" id="guest" data-lang="guests" placeholder="Số khách">
      </div>

      <div class="form-group">
        <textarea id="note" rows="3"
          placeholder="Loại bàn / Ghi chú (VIP sofa, sinh nhật, champagne...)"></textarea>
      </div>

      <button onclick="smartBooking()" class="btn-book">
        🍾 BOOK VIP TABLE
      </button>

    </div>

  </section>

  <!-- FOOTER LOAD BẰNG JS -->
  <div id="footer"></div>

  <!-- SCRIPTS -->
  <script src="js/lang.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
