<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Booking VIP | THE WANN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<div id="header"></div>

<section class="section booking glass">
  <h1>BOOK VIP TABLE</h1>
  <p>Đặt bàn nhanh – Xác nhận trực tiếp qua Zalo</p>

  <form id="bookingForm">
    <input type="text" placeholder="Tên của bạn" required>
    <input type="tel" placeholder="Số điện thoại" required>
    <input type="date" required>
    <input type="number" placeholder="Số khách" required>
    <button type="submit" class="btn-primary">BOOK VIA ZALO</button>
  </form>

  <p class="note">Hotline / Zalo / WhatsApp: <strong>0778 307 889</strong></p>
</section>

<div id="footer"></div>

<script src="js/booking.js"></script>
<script src="js/ui.js"></script>
<script src="js/lang.js"></script>
<script src="js/main.js"></script>
</body>
</html>
