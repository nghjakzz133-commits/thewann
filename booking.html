<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>VIP Booking | THE WANN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<div id="header"></div>

<section class="section glass booking-section">
  <h1>VIP TABLE BOOKING</h1>
  <p>Confirmation within 10 minutes by our VIP team</p>

  <!-- 🔥 FORM GỬI MAIL -->
  <form action="https://formspree.io/f/xgovglgn" method="POST">
   <input type="text" name="name" data-lang-placeholder="name">
    <input type="email" name="email" placeholder="Email Address" required>
    <input type="date" name="date" required>
    <input type="time" name="time" required>
    <input type="number" name="guests" placeholder="Number of guests" required>

    <!-- Hidden info -->
    <input type="hidden" name="club" value="THE WANN">
    <input type="hidden" name="location" value="51 Bùi Thị Xuân, Quận 1">
    <input type="hidden" name="_captcha" value="false">

    <button type="submit" class="btn-primary">
      📩 BOOK VIP TABLE
    </button>
  </form>
</section>

<div id="footer"></div>

<script src="js/ui.js"></script>

</body>
</html>
