<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>THE WANN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: black;
    }

    /* VIDEO BACKGROUND */
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      pointer-events: none; /* ẨN PLAYER */
    }

    /* OVERLAY + CONTENT */
    .content {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      background: rgba(0,0,0,0.35);
    }

    h1 {
      font-size: 60px;
      letter-spacing: 5px;
    }

    p {
      margin-top: 12px;
      letter-spacing: 3px;
      color: #ddd;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <video autoplay muted loop playsinline preload="auto">
    <source src="bg.mp4" type="video/mp4">
  </video>

  <div class="content">
    <h1>THE WANN</h1>
    <p>NIGHTLIFE • MUSIC • EXPERIENCE</p>
  </div>

</body>
</html>
