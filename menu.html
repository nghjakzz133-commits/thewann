<section id="menu" class="menu-section">
  <h2 class="menu-title">THỰC ĐƠN</h2>

  <div id="menuGrid" class="menu-grid"></div>
</section>

<script>
  const menuGrid = document.getElementById("menuGrid");

  // ✅ đổi số này đúng với ảnh cuối của mày
  const start = 7734;
  const end = 7802;

  for (let i = start; i <= end; i++) {
    const file = `IMG_${i}.jpeg`;
    const src = `./assets/images/menu/${file}`;

    const a = document.createElement("a");
    a.href = src;
    a.target = "_blank";

    const img = document.createElement("img");
    img.src = src;
    img.alt = file;
    img.loading = "lazy";

    a.appendChild(img);
    menuGrid.appendChild(a);
  }
</script>
